<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arlington & Bethesda Apartments</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8fafc; font-family: 'DM Sans', sans-serif; }
    textarea { font-family: 'DM Sans', sans-serif; }
    select, button, input { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ─── FIREBASE REST ────────────────────────────────────────────────────────
    const DB = "https://i-destiny-476217-j5-default-rtdb.europe-west1.firebasedatabase.app/user_data";

    async function dbRead() {
      const res = await fetch(`${DB}.json`);
      if (!res.ok) throw new Error(`Read failed: ${res.status}`);
      return await res.json() || {};
    }

    async function dbWrite(id, payload) {
      const res = await fetch(`${DB}/${id}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`Write failed: ${res.status}`);
      return await res.json();
    }

    // ─── BUILDING DATA (loaded from buildings.json) ────────────────────────────
    // buildings.json lives in the same directory and is the single source of truth
    // shared with the Playwright scraper

    // ─── CONSTANTS ────────────────────────────────────────────────────────────
    const HOODS     = ["All","Rosslyn","Courthouse","Virginia Square","Ballston","Clarendon","Bethesda"];
    const GYM_ORDER = { Excellent:4, Great:3, Medium:2, Small:1, None:0 };
    const GYM_COLORS = {
      Excellent:{ bg:"#ede9fe", text:"#5b21b6" }, Great:{ bg:"#dbeafe", text:"#1d4ed8" },
      Medium:{ bg:"#d1fae5", text:"#065f46" },    Small:{ bg:"#fef9c3", text:"#854d0e" },
      None:{ bg:"#f1f5f9", text:"#475569" },
    };
    const HOOD_COLORS = {
      Rosslyn:{ bg:"#dbeafe", text:"#1e40af" }, Courthouse:"#7c3aed",
      "Virginia Square":{ bg:"#d1fae5", text:"#065f46" }, Ballston:{ bg:"#fef3c7", text:"#92400e" },
      Clarendon:{ bg:"#fce7f3", text:"#9d174d" }, Bethesda:{ bg:"#e0e7ff", text:"#3730a3" },
    };
    const hoodStyle = h => {
      const c = HOOD_COLORS[h];
      if (!c) return { background:"#f1f5f9", color:"#334155" };
      return typeof c === "string" ? { background:"#ede9fe", color:c } : { background:c.bg, color:c.text };
    };
    const mapsUrl  = addr => `https://maps.apple.com/?q=${encodeURIComponent(addr)}`;
    const getPrice = p    => parseFloat((p||"0").replace(/[^0-9.]/g,"")) || 0;

    // ─── STAR RATING ──────────────────────────────────────────────────────────
    function StarRating({ value, onChange }) {
      return (
        <div style={{ display:"flex", gap:3, alignItems:"center" }}>
          {[...Array(10)].map((_,i) => (
            <button key={i} onClick={() => onChange(i+1 === value ? 0 : i+1)}
              style={{ background:"none", border:"none", cursor:"pointer", padding:0,
                       fontSize:20, color: i < value ? "#f59e0b" : "#cbd5e1", lineHeight:1 }}>★</button>
          ))}
          {value > 0 && <span style={{ fontSize:13, fontWeight:700, color:"#f59e0b", marginLeft:4 }}>{value}/10</span>}
        </div>
      );
    }

    // ─── CARD ─────────────────────────────────────────────────────────────────
    function Card({ b, note, score, saving, onSave }) {
      const [open,      setOpen]      = useState(false);
      const [editNote,  setEditNote]  = useState(note  || "");
      const [editScore, setEditScore] = useState(score || 0);
      const [dirty,     setDirty]     = useState(false);
      const gymC = GYM_COLORS[b.gym] || GYM_COLORS.None;

      useEffect(() => {
        if (!dirty) { setEditNote(note || ""); setEditScore(score || 0); }
      }, [note, score]);

      const priceBadge = (hi, source) => {
        if (source === "official" || (hi && hi !== "zillow"))
          return <span style={{fontSize:10,background:"#dcfce7",color:"#15803d",padding:"2px 6px",borderRadius:4,fontWeight:600}}>✓ official</span>;
        if (hi === "zillow")
          return <span style={{fontSize:10,background:"#dbeafe",color:"#1d4ed8",padding:"2px 6px",borderRadius:4,fontWeight:600}}>✓ Zillow</span>;
        return <span style={{fontSize:10,background:"#fef9c3",color:"#92400e",padding:"2px 6px",borderRadius:4}}>est.</span>;
      };

      const priceDisplay = (lo, hi) => (hi && hi !== "zillow") ? `${lo} – ${hi}` : lo;

      return (
        <div style={{ background:"#fff", borderRadius:16, border:"1px solid #e2e8f0",
                      overflow:"hidden", boxShadow:"0 1px 4px rgba(0,0,0,.06)" }}>
          {/* Header */}
          <div onClick={() => setOpen(!open)}
               style={{ padding:"14px 16px 12px", cursor:"pointer", userSelect:"none" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:4 }}>
                  <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:20, ...hoodStyle(b.hood) }}>{b.hood}</span>
                  {b.visited && <span style={{ fontSize:11, fontWeight:700, padding:"2px 7px", borderRadius:20, background:"#ecfdf5", color:"#065f46" }}>✓ visited</span>}
                  {b.priceSource === "official" && <span style={{ fontSize:11, fontWeight:600, padding:"2px 7px", borderRadius:20, background:"#dcfce7", color:"#15803d" }}>✓ official</span>}
                  {score > 0 && <span style={{ fontSize:11, fontWeight:700, padding:"2px 7px", borderRadius:20, background:"#fef3c7", color:"#b45309" }}>My score: {score}/10</span>}
                </div>
                <h3 style={{ margin:0, fontSize:16, fontWeight:700, color:"#0f172a", lineHeight:1.3 }}>{b.name}</h3>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
                <span style={{ fontSize:13, color:"#f59e0b", fontWeight:700 }}>★ {b.rating}</span>
                <span style={{ fontSize:20, color:"#94a3b8", display:"inline-block",
                               transform: open ? "rotate(90deg)" : "rotate(0deg)", transition:"transform .2s" }}>›</span>
              </div>
            </div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:"6px 14px", marginTop:6 }}>
              <span style={{ fontSize:12, color:"#64748b" }}>🚇 {b.metro}</span>
              <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:20, background:gymC.bg, color:gymC.text }}>{b.gym} gym</span>
            </div>
            <div style={{ display:"flex", gap:10, marginTop:10 }}>
              {[["2BR", b.price2, b.price2hi, b.priceSource], ["3BR", b.price3, b.price3hi, null]].map(([lbl, lo, hi, src]) => (
                <div key={lbl} style={{ flex:1, background:"#f8fafc", borderRadius:10, padding:"8px 10px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:4, marginBottom:3 }}>
                    <span style={{ fontSize:10, color:"#94a3b8", textTransform:"uppercase", letterSpacing:".05em" }}>{lbl}</span>
                    {priceBadge(hi, src)}
                  </div>
                  <div style={{ fontSize:15, fontWeight:700, color:"#0f172a" }}>{priceDisplay(lo, hi)}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Expanded */}
          {open && (
            <div style={{ borderTop:"1px solid #f1f5f9", padding:"12px 16px 16px" }}>
              <a href={mapsUrl(b.addr)} style={{
                display:"flex", alignItems:"center", gap:8, padding:"10px 12px",
                background:"#f0f9ff", borderRadius:10, marginBottom:12,
                textDecoration:"none", color:"#0369a1", fontSize:13, fontWeight:500,
                border:"1px solid #bae6fd"
              }}>
                <span>📍</span><span style={{ flex:1 }}>{b.addr}</span>
                <span style={{ fontSize:12, color:"#7dd3fc" }}>Open Maps →</span>
              </a>
              <div style={{ padding:"8px 12px", borderRadius:10, marginBottom:12, background:gymC.bg, border:`1px solid ${gymC.text}30` }}>
                <span style={{ fontSize:12, fontWeight:700, color:gymC.text }}>🏋️ {b.gym} gym: </span>
                <span style={{ fontSize:12, color:gymC.text }}>{b.gymNote}</span>
              </div>
              <p style={{ fontSize:13, color:"#475569", lineHeight:1.65, margin:"0 0 10px" }}>{b.desc}</p>
              <div style={{ borderLeft:"3px solid #3b82f6", paddingLeft:10, marginBottom:16, fontSize:13, color:"#1e40af", lineHeight:1.65 }}>
                <strong>Why live here:</strong> {b.why}
              </div>
              {/* Notes */}
              <div style={{ background:"#fffbeb", borderRadius:12, padding:"14px", border:"1px solid #fde68a" }}>
                <div style={{ fontSize:12, fontWeight:700, color:"#92400e", marginBottom:8 }}>📝 My notes</div>
                <textarea value={editNote}
                  onChange={e => { setEditNote(e.target.value); setDirty(true); }}
                  placeholder="Add notes after your visit…" rows={3}
                  style={{ width:"100%", padding:"8px 10px", borderRadius:8, border:"1px solid #fcd34d",
                           fontSize:13, color:"#1c1917", background:"#fff", resize:"vertical",
                           boxSizing:"border-box", lineHeight:1.5 }} />
                <div style={{ marginTop:12, marginBottom:8 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:"#92400e", marginBottom:8 }}>My score</div>
                  <StarRating value={editScore} onChange={v => { setEditScore(v); setDirty(true); }} />
                </div>
                {dirty && (
                  <button onClick={() => { onSave(b.id, editNote, editScore); setDirty(false); }}
                    style={{ marginTop:10, padding:"10px 18px",
                             background: saving ? "#fbbf24" : "#f59e0b",
                             color:"#fff", border:"none", borderRadius:8, fontSize:14,
                             fontWeight:700, cursor: saving ? "default" : "pointer", width:"100%" }}>
                    {saving ? "Saving…" : "Save notes & score"}
                  </button>
                )}
                {!dirty && (note || score > 0) && (
                  <div style={{ fontSize:11, color:"#a16207", marginTop:8 }}>✓ Synced to Firebase</div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── APP ──────────────────────────────────────────────────────────────────
    function App() {
      const [buildings, setBuildings] = useState([]);
      const [dbStatus,  setDbStatus]  = useState("loading");
      const [notes,     setNotes]     = useState({});
      const [saving,    setSaving]    = useState({});
      const [hood,      setHood]      = useState("All");
      const [sort,      setSort]      = useState("default");
      const [search,    setSearch]    = useState("");
      const [gymFilter, setGymFilter] = useState("All");

      useEffect(() => {
        // Load buildings.json, prices.json, and Firebase notes in parallel
        Promise.all([
          fetch('./buildings.json').then(r => r.json()),
          fetch('./prices.json').then(r => r.json()).catch(() => ({})),
          dbRead(),
        ])
          .then(([bldgs, prices, notes]) => {
            const merged = bldgs.map(b => {
              const p = prices[b.id];
              if (!p || !p.price2_min) return b;
              const lo = `$${p.price2_min.toLocaleString()}`;
              const hi = p.price2_max && p.price2_max > p.price2_min
                ? `$${p.price2_max.toLocaleString()}` : null;
              return { ...b, price2: hi ? lo : `${lo}+`, price2hi: hi, priceSource: "official" };
            });
            setBuildings(merged);
            setNotes(notes || {});
            setDbStatus("ok");
          })
          .catch(err => { console.error(err); setDbStatus("error"); });
      }, []);

      const handleSave = async (id, note, score) => {
        setNotes(n => ({ ...n, [id]: { note, score, updated: Date.now() } }));
        setSaving(s => ({ ...s, [id]: true }));
        try {
          await dbWrite(id, { note, score, updated: Date.now() });
          setDbStatus("ok");
        } catch (err) {
          console.error("Save failed:", err);
          setDbStatus("error");
        } finally {
          setSaving(s => ({ ...s, [id]: false }));
        }
      };

      const filtered = useMemo(() => {
        let list = buildings;
        if (hood === "Visited") list = list.filter(b => b.visited);
        else if (hood !== "All") list = list.filter(b => b.hood === hood);
        if (gymFilter !== "All") list = list.filter(b => b.gym === gymFilter);
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(b =>
            b.name.toLowerCase().includes(q) ||
            b.hood.toLowerCase().includes(q) ||
            b.desc.toLowerCase().includes(q)
          );
        }
        const scored = list.map(b => ({ ...b, myScore: notes[b.id]?.score || 0 }));
        if (sort === "price-asc")  scored.sort((a,b) => getPrice(a.price2) - getPrice(b.price2));
        if (sort === "price-desc") scored.sort((a,b) => getPrice(b.price2) - getPrice(a.price2));
        if (sort === "rating")     scored.sort((a,b) => b.rating - a.rating);
        if (sort === "metro")      scored.sort((a,b) => parseInt(a.metro) - parseInt(b.metro));
        if (sort === "gym")        scored.sort((a,b) => (GYM_ORDER[b.gym]||0) - (GYM_ORDER[a.gym]||0));
        if (sort === "my-score")   scored.sort((a,b) => b.myScore - a.myScore);
        return scored;
      }, [hood, sort, search, gymFilter, notes]);

      const visitedCount = Object.values(notes).filter(n => n.score > 0 || n.note).length;

      if (dbStatus === "error") return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                      minHeight:"100vh", background:"#fff1f2", gap:16, padding:24, textAlign:"center" }}>
          <div style={{ fontSize:48 }}>⚠️</div>
          <div style={{ fontSize:18, color:"#be123c", fontWeight:700 }}>Firebase connection failed</div>
          <div style={{ fontSize:14, color:"#64748b", maxWidth:320, lineHeight:1.6 }}>
            Set database rules to <code style={{background:"#f1f5f9",padding:"2px 6px",borderRadius:4}}>".read": true, ".write": true</code> in Firebase console.
          </div>
          <button onClick={() => { setDbStatus("loading"); dbRead().then(d => { setNotes(d||{}); setDbStatus("ok"); }).catch(() => setDbStatus("error")); }}
            style={{ padding:"12px 28px", background:"#be123c", color:"#fff", border:"none",
                     borderRadius:10, cursor:"pointer", fontSize:15, fontWeight:700 }}>
            Retry
          </button>
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:"#f8fafc" }}>
          {/* Header */}
          <div style={{ background:"linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%)", padding:"20px 16px 16px", color:"#fff" }}>
            <div style={{ maxWidth:680, margin:"0 auto" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                <div>
                  <div style={{ fontSize:11, letterSpacing:".15em", textTransform:"uppercase", color:"#7dd3fc", marginBottom:4 }}>
                    Apartment Research · August 2026
                  </div>
                  <h1 style={{ margin:0, fontSize:22, fontWeight:700, lineHeight:1.2 }}>
                    Rosslyn → Clarendon + Bethesda
                  </h1>
                  <p style={{ margin:"4px 0 0", fontSize:13, color:"#94a3b8" }}>
                    {buildings.length} buildings · tap to expand · notes sync across devices
                  </p>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:6, flexShrink:0 }}>
                  <div style={{ width:9, height:9, borderRadius:"50%",
                                background: dbStatus==="ok" ? "#4ade80" : dbStatus==="loading" ? "#fbbf24" : "#f87171",
                                boxShadow: `0 0 7px ${dbStatus==="ok" ? "#4ade80" : dbStatus==="loading" ? "#fbbf24" : "#f87171"}` }} />
                  <span style={{ fontSize:11, color:"#94a3b8" }}>
                    {dbStatus==="ok" ? "Firebase live" : dbStatus==="loading" ? "Syncing…" : "Offline"}
                  </span>
                </div>
              </div>
              <div style={{ display:"flex", gap:8, marginTop:10, flexWrap:"wrap" }}>
                {visitedCount > 0 && (
                  <div style={{ background:"rgba(245,158,11,.15)", border:"1px solid rgba(245,158,11,.4)",
                                borderRadius:10, padding:"6px 12px", fontSize:12, color:"#fcd34d" }}>
                    ★ You've rated {visitedCount} building{visitedCount !== 1 ? "s" : ""}
                  </div>
                )}
                {buildings.filter(b => b.visited).length > 0 && (
                  <div style={{ background:"rgba(16,185,129,.15)", border:"1px solid rgba(16,185,129,.4)",
                                borderRadius:10, padding:"6px 12px", fontSize:12, color:"#a7f3d0" }}>
                    ✓ {buildings.filter(b => b.visited).length} visited
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Sticky controls */}
          <div style={{ background:"#fff", borderBottom:"1px solid #e2e8f0", padding:"12px 16px", position:"sticky", top:0, zIndex:50 }}>
            <div style={{ maxWidth:680, margin:"0 auto" }}>
              <input value={search} onChange={e => setSearch(e.target.value)}
                placeholder="🔍 Search buildings…"
                style={{ width:"100%", padding:"10px 14px", borderRadius:10, border:"1px solid #e2e8f0",
                         fontSize:14, color:"#0f172a", background:"#f8fafc", boxSizing:"border-box", marginBottom:10 }} />
              <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:4, marginBottom:8 }}>
                {HOODS.map(h => (
                  <button key={h} onClick={() => setHood(h)}
                    style={{ padding:"7px 14px", borderRadius:20, border:"1px solid #e2e8f0",
                             background: hood===h ? "#0f172a" : "#fff", color: hood===h ? "#fff" : "#475569",
                             fontSize:12, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap" }}>{h}</button>
                ))}
                <button onClick={() => setHood("Visited")}
                  style={{ padding:"7px 14px", borderRadius:20, border:"1px solid #bbf7d0",
                           background: hood==="Visited" ? "#065f46" : "#f0fdf4", color: hood==="Visited" ? "#fff" : "#065f46",
                           fontSize:12, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap" }}>✓ Visited</button>
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <select value={sort} onChange={e => setSort(e.target.value)}
                  style={{ flex:1, padding:"9px 10px", borderRadius:8, border:"1px solid #e2e8f0", fontSize:12, color:"#0f172a", background:"#f8fafc" }}>
                  <option value="default">Sort: neighborhood</option>
                  <option value="my-score">Sort: my score ↓</option>
                  <option value="rating">Sort: Google rating ↓</option>
                  <option value="price-asc">Sort: 2BR price ↑</option>
                  <option value="price-desc">Sort: 2BR price ↓</option>
                  <option value="gym">Sort: gym quality ↓</option>
                  <option value="metro">Sort: metro distance ↑</option>
                </select>
                <select value={gymFilter} onChange={e => setGymFilter(e.target.value)}
                  style={{ flex:1, padding:"9px 10px", borderRadius:8, border:"1px solid #e2e8f0", fontSize:12, color:"#0f172a", background:"#f8fafc" }}>
                  <option value="All">All gym levels</option>
                  <option value="Excellent">Excellent</option>
                  <option value="Great">Great</option>
                  <option value="Medium">Medium</option>
                  <option value="Small">Small</option>
                  <option value="None">None</option>
                </select>
              </div>
            </div>
          </div>

          {/* Cards */}
          <div style={{ maxWidth:680, margin:"0 auto", padding:"14px 14px 40px" }}>
            <div style={{ fontSize:12, color:"#94a3b8", marginBottom:12 }}>
              Showing {filtered.length} of {buildings.length} buildings
              {dbStatus === "loading" && <span style={{ marginLeft:8, color:"#fbbf24" }}>· loading notes…</span>}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {filtered.map(b => (
                <Card key={b.id} b={b}
                  note={notes[b.id]?.note || ""}
                  score={notes[b.id]?.score || 0}
                  saving={!!saving[b.id]}
                  onSave={handleSave} />
              ))}
            </div>
            {filtered.length === 0 && (
              <div style={{ textAlign:"center", padding:"40px 20px", color:"#94a3b8" }}>
                <div style={{ fontSize:40, marginBottom:8 }}>🏙️</div>
                <div style={{ fontSize:15, fontWeight:600 }}>No buildings match your filters</div>
              </div>
            )}
            <div style={{ marginTop:32, padding:"14px 16px", background:"#fff", borderRadius:12, border:"1px solid #e2e8f0", fontSize:11, color:"#94a3b8", lineHeight:1.7 }}>
              <strong style={{ color:"#64748b" }}>Pricing (May 2026):</strong>&nbsp;
              <span style={{background:"#dcfce7",color:"#15803d",padding:"1px 6px",borderRadius:4,fontWeight:600}}>✓ official</span> from building website &nbsp;
              <span style={{background:"#dbeafe",color:"#1d4ed8",padding:"1px 6px",borderRadius:4,fontWeight:600}}>✓ Zillow</span> live starting price &nbsp;
              <span style={{background:"#fef9c3",color:"#92400e",padding:"1px 6px",borderRadius:4}}>est.</span> estimate only.
              Higher floors/views add $200–600. Bethesda Red Line adds ~15 min to DC.
              Notes sync via Firebase — shared across all your devices.
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
